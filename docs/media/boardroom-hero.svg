<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Great decisions deserve a room.</title>
  <desc id="desc">An editorial illustration of a configurable AI team. Example seats include Product, Engineering, Market, Logistics, and Finance, with the human CEO choosing the team and making the decision.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1200" y2="440" gradientUnits="userSpaceOnUse">
      <stop stop-color="#101924"/>
      <stop offset="1" stop-color="#1D3039"/>
    </linearGradient>
    <linearGradient id="table" x1="790" y1="110" x2="1040" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#28434A"/>
      <stop offset="1" stop-color="#182831"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" stroke="#C6DDD6" stroke-opacity=".045"/>
    </pattern>
  </defs>
  <rect width="1200" height="440" rx="18" fill="url(#background)"/>
  <rect width="1200" height="440" rx="18" fill="url(#grid)"/>
  <path d="M64 64H96" stroke="#D8EEAE" stroke-width="3"/>
  <text x="110" y="70" fill="#C4D3D6" font-family="Arial, Helvetica, sans-serif" font-size="15" letter-spacing="3">THE MOMENT BEFORE YOU BUILD</text>
  <g fill="#F5F4EC" font-family="Georgia, 'Times New Roman', serif" font-size="64" letter-spacing="-2">
    <text x="60" y="159">Great decisions</text>
    <text x="60" y="232">deserve a room.</text>
  </g>
  <text x="64" y="291" fill="#B8C8CC" font-family="Arial, Helvetica, sans-serif" font-size="22">Bring your ambition.</text>
  <text x="64" y="324" fill="#B8C8CC" font-family="Arial, Helvetica, sans-serif" font-size="22">Give it perspective.</text>
  <text x="64" y="392" fill="#D8EEAE" font-family="Arial, Helvetica, sans-serif" font-size="14" letter-spacing="2.5">BOARDROOM / HUMAN JUDGMENT, AMPLIFIED</text>
  <g stroke="#78938D" stroke-opacity=".45">
    <circle cx="902" cy="218" r="170" stroke-dasharray="3 10"/>
    <path d="M902 91V137M766 163L823 179M981 179L1039 163M766 275L823 260M981 260L1039 275M902 307V353"/>
  </g>
  <rect x="811" y="122" width="182" height="190" rx="75" fill="url(#table)" stroke="#78938D"/>
  <rect x="827" y="138" width="150" height="158" rx="61" stroke="#78938D" stroke-opacity=".22"/>
  <g fill="#EEF3E9" font-family="Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle" letter-spacing="1.5">
    <text x="902" y="205">YOUR MODELS.</text>
    <text x="902" y="231">YOUR ROLES.</text>
    <text x="902" y="257">YOUR CALL.</text>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle" letter-spacing="1.3">
    <rect x="833" y="56" width="138" height="43" rx="21.5" fill="#263E46" stroke="#78938D"/>
    <text x="902" y="83" fill="#DBE6DF">PRODUCT</text>
    <rect x="656" y="141" width="164" height="43" rx="21.5" fill="#263E46" stroke="#78938D"/>
    <text x="738" y="168" fill="#DBE6DF">ENGINEERING</text>
    <rect x="986" y="141" width="146" height="43" rx="21.5" fill="#263E46" stroke="#78938D"/>
    <text x="1059" y="168" fill="#DBE6DF">MARKET</text>
    <rect x="664" y="253" width="156" height="43" rx="21.5" fill="#263E46" stroke="#78938D"/>
    <text x="742" y="280" fill="#DBE6DF">LOGISTICS</text>
    <rect x="986" y="253" width="146" height="43" rx="21.5" fill="#263E46" stroke="#78938D"/>
    <text x="1059" y="280" fill="#DBE6DF">FINANCE</text>
    <rect x="842" y="337" width="120" height="49" rx="24.5" fill="#D8EEAE"/>
    <text x="902" y="368" fill="#182831" font-weight="700">YOU / CEO</text>
  </g>
</svg>
