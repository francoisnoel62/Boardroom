name: Local decision workflow

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            arch: x64
          - os: ubuntu-latest
            arch: x64
          - os: macos-14
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.12.0
          architecture: ${{ matrix.arch }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Install a real Secret Service for Linux vault qualification
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y dbus-x11 gnome-keyring
      - name: Qualify Linux with an unlocked disposable vault
        if: runner.os == 'Linux'
        env:
          BOARDROOM_REQUIRE_HOST_VAULT: 'true'
        run: dbus-run-session -- sh -c 'printf "%s" "boardroom-ci-dummy" | gnome-keyring-daemon --unlock --components=secrets; npm test'
      - name: Qualify Windows and macOS host vaults
        if: runner.os != 'Linux'
        env:
          BOARDROOM_REQUIRE_HOST_VAULT: 'true'
        run: npm test
      - run: npm run package -- --output release/candidate
      - name: Run the commands the documentation presents as runnable
        run: node site/scripts/doc-commands.mjs --repo . --candidate release/candidate
      - name: Archive candidate with native executable modes
        run: tar -czf release/boardroom.tar.gz -C release candidate
      - uses: actions/upload-artifact@v7
        with:
          name: boardroom-candidate-${{ matrix.os }}-${{ matrix.arch }}
          path: release/boardroom.tar.gz
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: boardroom-ci-tools-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            scripts/clean-ci-node.ps1
            scripts/clean-ci-node.sh
            scripts/install.sh
            scripts/install.ps1
            qualification/Dockerfile
            tests/support/provider-http.mjs

  installed:
    needs: verify
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            arch: x64
          - os: ubuntu-latest
            arch: x64
          - os: macos-14
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      # A distinct VM downloads the archive; no source checkout or setup-node step.
      - uses: actions/download-artifact@v8
        with:
          name: boardroom-candidate-${{ matrix.os }}-${{ matrix.arch }}
          path: incoming
      - uses: actions/download-artifact@v8
        with:
          name: boardroom-ci-tools-${{ matrix.os }}-${{ matrix.arch }}
          path: tools
      - name: Extract archive into a Unicode and space path
        shell: bash
        run: |
          mkdir -p 'Boardroom clean François' evidence
          tar -xzf incoming/boardroom.tar.gz -C 'Boardroom clean François'
      - name: Qualify Windows without installed application Node
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $proof = Join-Path $PWD 'evidence/no-node.json'
          & ./tools/scripts/clean-ci-node.ps1 -ProofPath $proof
          $env:BOARDROOM_INSTALLATION_MODE = 'clean'
          $env:BOARDROOM_NO_NODE_PROOF = $proof
          $env:BOARDROOM_QUALIFICATION_OUTPUT = Join-Path $PWD 'evidence'
          $env:BOARDROOM_REQUIRE_HOST_VAULT = 'true'
          $env:BOARDROOM_QUALIFICATION_HTTP_HOOK = Join-Path $PWD 'tools/tests/support/provider-http.mjs'
          & './Boardroom clean François/candidate/runtime/node.exe' --test './Boardroom clean François/candidate/qualification/installed.test.mjs'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Qualify macOS without installed application Node
        if: runner.os == 'macOS'
        shell: bash
        run: |
          bash tools/scripts/clean-ci-node.sh "$PWD/evidence/no-node.json"
          BOARDROOM_QUALIFICATION_HTTP_HOOK="$PWD/tools/tests/support/provider-http.mjs" BOARDROOM_REQUIRE_HOST_VAULT=true BOARDROOM_INSTALLATION_MODE=clean BOARDROOM_NO_NODE_PROOF="$PWD/evidence/no-node.json" BOARDROOM_QUALIFICATION_OUTPUT="$PWD/evidence" \
            './Boardroom clean François/candidate/runtime/node' --test './Boardroom clean François/candidate/qualification/installed.test.mjs'
      - name: Qualify Linux in an offline image containing no Node
        if: runner.os == 'Linux'
        shell: bash
        run: |
          docker build -t boardroom-no-node tools/qualification
          docker run --rm --network none --user "$(id -u):$(id -g)" \
            -v "$PWD/Boardroom clean François/candidate:/candidate:ro" -v "$PWD/evidence:/evidence" -v "$PWD/tools:/tools:ro" \
            -e BOARDROOM_QUALIFICATION_HTTP_HOOK=/tools/tests/support/provider-http.mjs -e BOARDROOM_INSTALLATION_MODE=clean -e BOARDROOM_NO_NODE_PROOF=/evidence/no-node.json -e BOARDROOM_QUALIFICATION_OUTPUT=/evidence \
            boardroom-no-node /bin/sh -c 'set -eu; ! command -v node; printf "{\"schemaVersion\":1,\"strategy\":\"fresh-ubuntu-image-no-node-offline\",\"systemNodeVisible\":false,\"absentPaths\":[\"/usr/bin/node\",\"/usr/local/bin/node\"]}" > /evidence/no-node.json; /candidate/runtime/node --test /candidate/qualification/installed.test.mjs'
      # The published installers, run against a local release directory holding this candidate.
      - name: Install the candidate with install.sh and run doctor
        if: runner.os != 'Windows'
        shell: bash
        run: |
          platform=$([ "$RUNNER_OS" = macOS ] && echo macos || echo linux)
          mkdir -p installer-release
          cp incoming/boardroom.tar.gz "installer-release/boardroom-0.0.0-ci-$platform-${{ matrix.arch }}.tar.gz"
          (cd installer-release && shasum -a 256 *.tar.gz > SHA256SUMS)
          BOARDROOM_DOWNLOAD_BASE="file://$PWD/installer-release" BOARDROOM_VERSION=0.0.0-ci \
            BOARDROOM_INSTALL_DIR="$PWD/installed by script" BOARDROOM_BIN_DIR="$PWD/installer-bin" sh tools/scripts/install.sh
          "$PWD/installer-bin/boardroom" doctor --json --data-dir "$PWD/installer-data"
      - name: Install the candidate with install.ps1 and run doctor
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force installer-release | Out-Null
          Copy-Item incoming/boardroom.tar.gz 'installer-release/boardroom-0.0.0-ci-windows-x64.tar.gz'
          $hash = (Get-FileHash 'installer-release/boardroom-0.0.0-ci-windows-x64.tar.gz' -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -Path installer-release/SHA256SUMS -Value "$hash  boardroom-0.0.0-ci-windows-x64.tar.gz"
          $env:BOARDROOM_DOWNLOAD_BASE = ([Uri](Resolve-Path installer-release).Path).AbsoluteUri
          $env:BOARDROOM_VERSION = '0.0.0-ci'
          $env:BOARDROOM_INSTALL_DIR = Join-Path $PWD 'installed by script'
          $env:BOARDROOM_BIN_DIR = Join-Path $PWD 'installer-bin'
          $env:BOARDROOM_NO_MODIFY_PATH = '1'
          & ./tools/scripts/install.ps1
          & (Join-Path $PWD 'installer-bin/boardroom.cmd') doctor --json --data-dir (Join-Path $PWD 'installer-data')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: boardroom-installation-evidence-${{ matrix.os }}-${{ matrix.arch }}
          path: evidence/
          if-no-files-found: error
